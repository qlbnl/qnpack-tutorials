# GitHub Pages Configuration
# This site serves only the tutorial agenda - no code is exposed

title: Quantum Network and Repeater Simulation Tutorial
description: QCE'26 Tutorial Agenda

# Use a minimal theme
theme: jekyll-theme-minimal

# Exclude everything except index.md from the site
exclude:
  - "*.ipynb"
  - "*.py"
  - "*.json"
  - "*.txt"
  - "*.csv"
  - "*.png"
  - "*.jpg"
  - "*.jpeg"
  - "*.gif"
  - "*.pdf"
  - examples/
  - QCE25/
  - QCE26/
  - start_here.ipynb
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
